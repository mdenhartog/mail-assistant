- name: Huis/Onderhoud
  kind: topic
  description: 'Repairs, quotes and appointments with tradespeople for the house. Meaning lost: the original
    rule also looked at the subject line (mails whose subject mentions an appointment); that condition
    is kept here as text only.'
  senders:
  - entry: klusbedrijf.example.net
    subdomains: true
