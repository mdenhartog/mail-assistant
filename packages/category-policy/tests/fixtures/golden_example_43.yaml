# Anonymised example of a 43-category structure (nested names, one extra label, ticks, sender lists).
# Every sender domain is an example.* domain. The real conversion is reviewed by its owner and is not in the repository.
schema: 1
generalInstructions: Mail from the school and from the general practitioner is always important. Prefer
  the most specific category. Anything that fits no category stays in Other.
archiveLabel: Archive
categories:
- name: Huis
  kind: topic
  description: Anything about the house that has no more specific home below.
  senders: []
  notify: false
- name: Huis/Energie
  kind: topic
  description: Energy contracts, meter readings, yearly statements and tariff changes.
  senders:
  - energie.example.com
  - service@gas.example.net
  notify: true
- name: Huis/Water
