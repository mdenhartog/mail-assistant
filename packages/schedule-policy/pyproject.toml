[project]
name = "schedule-policy"
version = "0.1.0"
description = "Shared schedule policy: TimePolicy, validation and time parsing (INT-002)"
requires-python = ">=3.12"
dependencies = [
    "tzdata>=2026.6",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "schedule_policy"

[dependency-groups]
dev = [
    "cosmic-ray>=8.7.0",
    "hypothesis>=6.150.0",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[tool.uv]
exclude-newer = "7 days"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "TC", "RUF", "S", "PT", "DTZ", "ERA", "TID", "ANN", "D", "C90", "PL"]
ignore = ["D100", "D104"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D", "ANN", "PLR2004"]
# Full-width and Arabic-Indic digits are deliberate hostile inputs (AC-9).
"tests/test_parse.py" = ["RUF001"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["schedule_policy"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
# Strict checking applies to the package; tests are plain pytest functions (as in agents/mail-triage, which checks app/ only).
include = ["schedule_policy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --cov=schedule_policy --cov-branch --cov-report=term-missing --cov-fail-under=90"
