# The security headers of every response of the web image (U-web-settings-59). The ONE place they are written.
# nginx drops the inherited add_header directives of a level as soon as a location has its own add_header, so every
# location in nginx.conf includes this file; do not repeat these headers there.
# HSTS is set at the edge (the compose Caddy edge, the ingress in Kubernetes): TLS terminates there.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
