server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # This server proxies nothing: /api and /auth are routed to the API by the edge, never by this image.
    # The security headers live in one file. A location with its own add_header drops everything inherited from the
    # server level, so EVERY location below includes the file itself (and the test of the config checks it).

    # Exactly three page routes serve the single page; everything else is a 404 (AC-19).
    location = / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        rewrite ^ /index.html break;
    }

    location = /login {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        rewrite ^ /index.html break;
    }

    location = /settings {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        rewrite ^ /index.html break;
    }

    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        return 404;
    }
}
