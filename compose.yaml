# Local stack (guardrail-compose). Profiles:
#   dev       — hot reload backend + Vite dev server
#   prod-like — the production images (read-only, non-root) for e2e, ZAP and demos
#   test      — runs the backend and web test suites in containers, like CI
# db and mail always run. The IdP (Keycloak) is added once identity-architecture decides on it.
name: mail-assistant
include:
  - agents/mail-triage/compose.yaml
  - channels/chat-gateway/compose.yaml
  - agents/assistant/compose.yaml
  - mcp-servers/tools/compose.yaml

x-hardening: &hardening
  read_only: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  tmpfs: ["/tmp"]

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    ports: ["127.0.0.1:${DB_PORT:-5432}:5432"]
    # TLS (ADR-0037, W-9): when deploy/prod-like/certs.sh has made db.crt and db.key, db-tls.sh turns TLS on and loads the
    # pg_hba.conf that lets the web role in over TLS only. Without them (dev, test) the database starts as before.
    entrypoint: ["/bin/sh", "/usr/local/bin/db-tls.sh"]
    command: ["postgres"]
    volumes:
      - db-data:/var/lib/postgresql
      - ./deploy/prod-like/db-tls.sh:/usr/local/bin/db-tls.sh:ro
      - ./deploy/prod-like/pg_hba.conf:/etc/postgresql-tls/pg_hba.conf:ro
      - ./deploy/prod-like/certs:/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      retries: 10

  mail:
    image: axllent/mailpit:v1.32.0
    ports: ["127.0.0.1:${MAIL_PORT:-8025}:8025"]

  api-dev:
    profiles: ["dev"]
    build: { context: ., dockerfile: backend/Dockerfile, target: build }
    command: ["uv", "run", "--frozen", "uvicorn", "app.main:create_app", "--factory", "--reload", "--host", "0.0.0.0", "--port", "8000"]
    working_dir: /srv/backend
    environment:
      APP_ENVIRONMENT: development
    volumes: ["./backend/app:/srv/backend/app"]
    ports: ["127.0.0.1:${API_DEV_PORT:-8000}:8000"]
    depends_on: { db: { condition: service_healthy } }

  web-dev:
    profiles: ["dev"]
    image: node:24-bookworm-slim
    working_dir: /repo
    command: ["sh", "-c", "corepack enable && pnpm install --frozen-lockfile && pnpm --filter web dev"]
    volumes: [".:/repo", "web-node-modules:/repo/node_modules"]
    ports: ["127.0.0.1:${WEB_DEV_PORT:-5173}:5173"]

  api:
    profiles: ["prod-like"]
    <<: *hardening
    image: mail-assistant-api:local
    build: { context: ., dockerfile: backend/Dockerfile }
    environment:
      APP_ENVIRONMENT: production
      # The web role over TLS with the host name checked against the private CA (asyncpg `ssl`, not libpq `sslmode`).
      # The role and its password are made by the migrate service (WEB_ROLE_PASSWORD); the owner credentials stay there.
      APP_DATABASE_URL: postgresql+asyncpg://web_settings_runtime:${WEB_ROLE_PASSWORD:-}@db:5432/app
      APP_DATABASE_SSL: verify-full
      APP_DATABASE_CA_FILE: /certs/ca.crt
    volumes:
      - ./deploy/prod-like/certs/ca.crt:/certs/ca.crt:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 5s
      retries: 10
    depends_on: { db: { condition: service_healthy } }

  web:
    profiles: ["prod-like"]
    <<: *hardening
    tmpfs: ["/tmp", "/var/cache/nginx"]
    image: mail-assistant-web:local
    build: { context: ., dockerfile: apps/web/Dockerfile }
    ports: ["127.0.0.1:${WEB_PORT:-8080}:8080"]
    depends_on: { api: { condition: service_healthy } }

  # The TLS edge (ADR-0037): HTTPS from a private CA made by deploy/prod-like/certs.sh, local host name only.
  # /api and /auth go to api, the rest to web. Run deploy/prod-like/certs.sh before the first `up`.
  edge:
    profiles: ["prod-like"]
    <<: *hardening
    image: caddy:2.10.2-alpine
    user: "10001:10001"
    # The caddy image sets the file capability cap_net_bind_service on /usr/bin/caddy; with the bounding set emptied by
    # cap_drop ALL the kernel refuses to exec it (EPERM, exit 255). Only this one capability is added back, for the exec:
    # the ports are unprivileged and no-new-privileges stops the process from gaining it.
    cap_add: ["NET_BIND_SERVICE"]
    tmpfs: ["/tmp", "/data:uid=10001,gid=10001", "/config:uid=10001,gid=10001"]
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    environment:
      EDGE_HTTPS_PORT: ${EDGE_HTTPS_PORT:-8443}
    ports:
      - "127.0.0.1:${EDGE_HTTPS_PORT:-8443}:8443"
      - "127.0.0.1:${EDGE_HTTP_PORT:-8081}:8081"
    volumes:
      - ./deploy/prod-like/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/prod-like/certs:/certs:ro
    networks:
      default:
        aliases: ["mail-assistant.localhost"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8082/healthz"]
      interval: 5s
      retries: 10
    depends_on:
      api: { condition: service_healthy }
      web: { condition: service_healthy }

  api-test:
    profiles: ["test"]
    build: { context: ., dockerfile: backend/Dockerfile, target: build }
    working_dir: /srv/backend
    command: ["sh", "-c", "uv sync --frozen && uv run pytest"]
    volumes: ["./backend:/srv/backend"]
    environment:
      APP_ENVIRONMENT: test

  web-test:
    profiles: ["test"]
    image: node:24-bookworm-slim
    working_dir: /repo
    command: ["sh", "-c", "corepack enable && pnpm install --frozen-lockfile && pnpm -r test"]
    volumes: [".:/repo", "web-node-modules:/repo/node_modules"]

volumes:
  db-data:
  web-node-modules:
