[project]
name = "mail-assistant-mail-triage"
version = "0.1.0"
description = "mail-triage agent"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "cryptography>=50.0.2",
    "google-api-python-client>=2.201.0",
    "google-auth>=2.62.1",
    "httpx>=0.28.1",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "schedule-policy",
    "sqlalchemy[asyncio]>=2.1.8",
    "tzdata>=2026.6",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "cosmic-ray>=8.7.0",
    "pip-audit>=2.10.1",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=7.1.0",
    "pyyaml>=6.0.3",
    "ruff>=0.17.4",
    "testcontainers[postgres]>=4.15.0",
    "types-pyyaml>=6.0.12.20261103",
]

[tool.uv]
exclude-newer = "7 days"
package = false

# Shared package of INT-002 (design: Packaging). The image is built from the repo root so this path exists there too.
[tool.uv.sources]
schedule-policy = { path = "../../packages/schedule-policy" }

# Temporary: versions already locked that are younger than the cooldown. Remove after 2026-11-15 (ADR-0022).
[tool.uv.exclude-newer-package]
anyio = "2026-11-08T23:59:59Z"
coverage = "2026-11-08T23:59:59Z"
filelock = "2026-11-08T23:59:59Z"
google-api-core = "2026-11-08T23:59:59Z"
google-auth = "2026-11-08T23:59:59Z"
pip = "2026-11-08T23:59:59Z"
platformdirs = "2026-11-08T23:59:59Z"
py-serializable = "2026-11-08T23:59:59Z"
pydantic = "2026-11-08T23:59:59Z"
pydantic-core = "2026-11-08T23:59:59Z"
pytest-asyncio = "2026-11-08T23:59:59Z"
ruff = "2026-11-08T23:59:59Z"
sqlalchemy = "2026-11-08T23:59:59Z"
types-pyyaml = "2026-11-08T23:59:59Z"
typing-inspection = "2026-11-08T23:59:59Z"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "TC", "RUF", "ASYNC", "S", "PT", "DTZ", "ERA", "TID", "ANN", "D", "C90", "PL"]
ignore = ["D100", "D104"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106", "D", "ANN", "PLR2004"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["app", "schedule_policy"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
# The Google client libraries ship partial type information: strict checking applies to our own code (app/), and the
# three "Unknown" rules are relaxed because their clients and credentials are only partly typed.
include = ["app"]
reportMissingTypeStubs = false
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"
reportUnknownArgumentType = "none"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q --strict-markers --cov=app --cov-branch --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
omit = ["app/__main__.py"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
