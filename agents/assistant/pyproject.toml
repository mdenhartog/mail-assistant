[project]
name = "mail-assistant-assistant"
version = "0.1.0"
description = "assistant agent"
requires-python = ">=3.12"
dependencies = [
    "bedrock-agentcore[a2a,strands-agents]>=1.25.4",
    "httpx>=0.28.1",
    "pydantic>=2.14.3",
    "strands-agents>=1.64.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "httpx2>=2.16.0",
    "pip-audit>=2.10.1",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]

[tool.uv]
exclude-newer = "7 days"
package = false

# Temporary: versions already locked that are younger than the cooldown. Remove after 2026-11-15 (ADR-0022).
[tool.uv.exclude-newer-package]
anyio = "2026-11-08T23:59:59Z"
bedrock-agentcore = "2026-11-08T23:59:59Z"
boto3 = "2026-11-08T23:59:59Z"
botocore = "2026-11-08T23:59:59Z"
click = "2026-11-08T23:59:59Z"
coverage = "2026-11-08T23:59:59Z"
fastapi = "2026-11-08T23:59:59Z"
filelock = "2026-11-08T23:59:59Z"
google-api-core = "2026-11-08T23:59:59Z"
google-auth = "2026-11-08T23:59:59Z"
pip = "2026-11-08T23:59:59Z"
platformdirs = "2026-11-08T23:59:59Z"
py-serializable = "2026-11-08T23:59:59Z"
pydantic = "2026-11-08T23:59:59Z"
pydantic-core = "2026-11-08T23:59:59Z"
pytest-asyncio = "2026-11-08T23:59:59Z"
ruff = "2026-11-08T23:59:59Z"
sse-starlette = "2026-11-08T23:59:59Z"
strands-agents = "2026-11-08T23:59:59Z"
typing-inspection = "2026-11-08T23:59:59Z"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "TC", "RUF", "ASYNC", "S", "PT", "DTZ", "ERA", "TID", "ANN", "D", "C90", "PL"]
ignore = ["D100", "D104"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106", "D", "ANN", "PLR2004"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
# The agent SDKs ship partial type information: strict checking applies to our own code (app/), and the
# three "Unknown" rules are relaxed because their decorators and clients are only partly typed.
include = ["app"]
reportMissingTypeStubs = false
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"
reportUnknownArgumentType = "none"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
# Deprecations raised inside the AWS and Strands libraries themselves are not ours to fix; ours still fail the run if promoted.
filterwarnings = [
    "ignore::DeprecationWarning:bedrock_agentcore.*",
    "ignore::DeprecationWarning:strands.*",
]
addopts = "-q --strict-markers --cov=app --cov-branch --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
omit = ["app/__main__.py", "app/healthcheck.py"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
