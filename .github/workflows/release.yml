# Release (git-workflow, SDLC phase 9): release-please → signed images with SBOM in GHCR.
# Promotion to staging/production happens via PRs on the GitOps config, never from here.
name: release
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  packages: write
  id-token: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        # With RELEASE_PLEASE_TOKEN (a fine-grained token with contents and pull requests write) the release
        # pull request is opened as a normal user, so CI runs on it without anyone approving the run.
        with: { token: "${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}" }

  images:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: api, context: ., file: backend/Dockerfile }
          - { name: web, context: ., file: apps/web/Dockerfile }
          - { name: mail-triage, context: ., file: agents/mail-triage/Dockerfile }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          provenance: true
          tags: ghcr.io/${{ github.repository }}/${{ matrix.name }}:${{ needs.release-please.outputs.tag }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ghcr.io/${{ github.repository }}/${{ matrix.name }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom-${{ matrix.name }}.spdx.json
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: sign and attest
        run: |
          IMAGE=ghcr.io/${{ github.repository }}/${{ matrix.name }}@${{ steps.build.outputs.digest }}
          cosign sign --yes "$IMAGE"
          cosign attest --yes --type spdxjson --predicate sbom-${{ matrix.name }}.spdx.json "$IMAGE"
      - name: digest for the GitOps PR
        run: echo "${{ matrix.name }} digest ${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
