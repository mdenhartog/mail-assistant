# PR testing (git-workflow, secure-by-design layer 2). Renovate pins action digests.
name: ci
on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run bandit -q -c pyproject.toml -r app
      - run: uv run vulture
      - run: uv run xenon --max-absolute B --max-modules A --max-average A app
      - run: uv run deptry .
      - run: uv run pytest
      - run: uv run python -m app.export_openapi --check
      - run: uv run pip-audit

  docs:
    # Markdown lint (specs, ADRs, plans, READMEs, CLAUDE.md) and the documentation check (README, API reference, user guide, links).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version: 24 }
      - run: npx --yes markdownlint-cli2@0.24.0
      - run: node scripts/docs.mjs check

  components:
    # Agents, MCP servers and channel gateways (.sdlc/components.json): lint, types, security, tests, audit, images.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version: 24 }
      - run: node scripts/components.mjs check
      - run: node scripts/components.mjs audit
      - name: hadolint
        run: |
          for f in agents/*/Dockerfile mcp-servers/*/Dockerfile channels/*/Dockerfile; do
            if [ -f "$f" ]; then docker run --rm -i hadolint/hadolint:v2.15.1 < "$f"; fi
          done
      - name: shared package is in the mail-triage image
        run: |
          docker build -f agents/mail-triage/Dockerfile -t local/mail-triage:ci .
          docker run --rm --entrypoint python local/mail-triage:ci -c "from schedule_policy.policy import DEFAULT_POLICY; assert DEFAULT_POLICY"
      - name: build and scan the images
        run: |
          for dir in agents/* mcp-servers/* channels/*; do
            if [ -f "$dir/Dockerfile" ]; then
              # Images that depend on a shared package (packages/*) are built from the repo root.
              case "$dir" in agents/mail-triage) context=. ;; *) context="$dir" ;; esac
              docker build -f "$dir/Dockerfile" -t "local/$(basename "$dir"):ci" "$context"
              docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.76.2 image --exit-code 1 --ignore-unfixed --severity HIGH,CRITICAL "local/$(basename "$dir"):ci"
            fi
          done

  schedule-policy:
    # The shared schedule policy (INT-002, ADR-0030 item 4): the agent image and the backend both rely on its limits.
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: packages/schedule-policy } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest
      - run: uv run pip-audit

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: node packages/tokens/build.mjs --check
      - run: pnpm -r lint
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: pnpm knip
      - run: pnpm run audit

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { fetch-depth: 0 }
      - name: semgrep
        run: docker run --rm -e SEMGREP_SEND_METRICS=off -v "$PWD:/src" semgrep/semgrep:1.182.0 semgrep scan --config p/owasp-top-ten --config p/secrets --config .semgrep/ --error
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 git /repo --redact --no-banner
      - name: trivy config (Dockerfiles, compose, chart)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with: { scan-type: config, scan-ref: ., exit-code: "1", severity: "HIGH,CRITICAL" }

  images:
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: hadolint
        run: |
          docker run --rm -i hadolint/hadolint:v2.15.1 < backend/Dockerfile
          docker run --rm -i hadolint/hadolint:v2.15.1 < apps/web/Dockerfile
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: build api
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with: { context: ., file: backend/Dockerfile, load: true, tags: "local/api:ci" }
      - name: build web
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with: { context: ., file: apps/web/Dockerfile, load: true, tags: "local/web:ci" }
      - name: trivy api
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with: { image-ref: "local/api:ci", exit-code: "1", ignore-unfixed: true, severity: "HIGH,CRITICAL" }
      - name: trivy web
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with: { image-ref: "local/web:ci", exit-code: "1", ignore-unfixed: true, severity: "HIGH,CRITICAL" }

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
      - run: helm lint --strict deploy/charts/app -f deploy/envs/local/values.yaml
      - name: kubeconform
        run: helm template app deploy/charts/app -f deploy/envs/local/values.yaml | docker run --rm -i ghcr.io/yannh/kubeconform:v0.8.0-alpine -strict -summary -
      - name: kube-linter
        run: helm template app deploy/charts/app -f deploy/envs/local/values.yaml > /tmp/render.yaml && docker run --rm -v /tmp:/tmp stackrox/kube-linter:v0.8.3 lint /tmp/render.yaml

  helm-worker:
    # The worker chart with its migration Job (ADR-0025), rendered with the local values of mail-triage.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
      - run: helm lint --strict deploy/charts/worker -f deploy/envs/local/mail-triage.yaml
      - name: kubeconform
        run: helm template mail-triage deploy/charts/worker -f deploy/envs/local/mail-triage.yaml | docker run --rm -i ghcr.io/yannh/kubeconform:v0.8.0-alpine -strict -summary -
      - name: kube-linter
        run: helm template mail-triage deploy/charts/worker -f deploy/envs/local/mail-triage.yaml > /tmp/render-worker.yaml && docker run --rm -v /tmp:/tmp stackrox/kube-linter:v0.8.3 lint /tmp/render-worker.yaml

  e2e:
    runs-on: ubuntu-latest
    needs: [images]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: echo "POSTGRES_PASSWORD=ci-$(openssl rand -hex 12)" > .env
      - name: private CA and edge certificate
        run: deploy/prod-like/certs.sh
      - run: docker compose --profile prod-like up -d --build --wait
      - name: edge checks (redirect, HSTS, 404 matrix, query-free log)
        run: |
          base=https://mail-assistant.localhost:8443
          curl_edge() { curl -sS --cacert deploy/prod-like/certs/ca.crt --resolve mail-assistant.localhost:8443:127.0.0.1 "$@"; }
          location="$(curl -sS -o /dev/null -w '%{redirect_url}' http://127.0.0.1:8081/settings)"
          test "$location" = "https://mail-assistant.localhost:8443/settings"
          headers="$(curl_edge -D - -o /dev/null "$base/settings")"
          echo "$headers" | grep -i '^Strict-Transport-Security: max-age=31536000\s*$'
          if echo "$headers" | grep -qi 'includesubdomains\|preload'; then echo "HSTS is too broad"; exit 1; fi
          echo "$headers" | grep -i '^content-security-policy:'
          echo "$headers" | grep -i '^x-content-type-options: nosniff'
          for path in / /login /settings; do
            code="$(curl_edge -o /dev/null -w '%{http_code}' "$base$path")"
            test "$code" = 200 || { echo "$path answered $code"; exit 1; }
          done
          for path in /docs /redoc /openapi.json /healthz /readyz /metrics /api/docs /api/openapi.json /api/readyz /auth/anything-unknown /anything; do
            code="$(curl_edge -o /dev/null -w '%{http_code}' "$base$path")"
            test "$code" = 404 || { echo "$path answered $code"; exit 1; }
          done
          for path in /auth/login /api/settings; do
            test "$(docker compose exec -T web wget -q -S -O /dev/null "http://127.0.0.1:8080$path" 2>&1 | grep -c 'HTTP/1.1 404')" = 1
          done
          curl_edge -o /dev/null "$base/settings?probe=edge-log-canary"
          sleep 1
          docker compose --profile prod-like logs --no-color edge | grep '/settings'
          if docker compose --profile prod-like logs --no-color edge | grep -q -e 'edge-log-canary' -e 'probe='; then echo "the edge log has a query string"; exit 1; fi
      - name: let the browser trust the private CA
        run: |
          sudo apt-get install -y --no-install-recommends libnss3-tools
          mkdir -p "$HOME/.pki/nssdb"
          certutil -d "sql:$HOME/.pki/nssdb" -N --empty-password
          certutil -d "sql:$HOME/.pki/nssdb" -A -t "C,," -n mail-assistant-ci-ca -i deploy/prod-like/certs/ca.crt
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm --filter web e2e
        env: { E2E_BASE_URL: "https://mail-assistant.localhost:8443" }
      - if: failure()
        run: docker compose --profile prod-like logs --no-color edge web api
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with: { name: playwright-report, path: apps/web/playwright-report }

  runtime-role:
    # AC-30 (INT-002): after the migrate job has run against the prod-like database, the runtime role cannot
    # run DDL, change the audit rows or create roles, while normal settings work still succeeds.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - run: printf 'POSTGRES_PASSWORD=ci-%s\nMAIL_TRIAGE_RUNTIME_PASSWORD=ci-%s\n' "$(openssl rand -hex 12)" "$(openssl rand -hex 12)" > .env
      - run: deploy/prod-like/certs.sh
      - run: docker compose --profile prod-like up -d --build --wait
      - name: migrate (creates the runtime role; a one-shot service cannot be part of `up --wait`)
        run: |
          set -a; . ./.env; set +a
          docker compose run --rm --build mail-triage-migrate
      - name: runtime role checks
        run: |
          set -a; . ./.env; set +a
          uv run --frozen --project agents/mail-triage pytest -c tests/e2e/pytest.ini tests/e2e
      - if: failure()
        run: docker compose --profile prod-like logs --no-color db
      - if: always()
        run: docker compose --profile prod-like down --volumes

  gxp:
    # GAMP 5 evidence run + validation package (only in projects with validation/system.yaml)
    runs-on: ubuntu-latest
    needs: [images]
    if: vars.GXP_ENABLED == 'true'  # off for this project (ADR-0006); hashFiles() is not allowed in a job-level if
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm gxp:check
      - run: echo "POSTGRES_PASSWORD=ci-$(openssl rand -hex 12)" > .env
      - run: deploy/prod-like/certs.sh
      - run: docker compose --profile prod-like up -d --build --wait
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm --filter web e2e:gxp
        env: { GXP_EXECUTED_BY: "ci (${{ github.actor }})" }
      - if: always()
        run: pnpm gxp:package && pnpm gxp:verify "validation/packages/$(cat validation/evidence/runs/LATEST)"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with: { name: validation-package, path: validation/packages, retention-days: 90 }
