# PR testing (git-workflow, secure-by-design layer 2). Renovate pins action digests.
# A pull request runs only the jobs its files need (job `changes`, scripts/ci-changes.mjs); a skipped job
# counts as passed for the required checks. A merge to main is not tested again (the pull request was
# up to date with main when it merged); instead the whole suite runs every night on main, and by hand.
name: ci
on:
  pull_request:
  merge_group:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions: { contents: read, pull-requests: read }
    outputs:
      backend: ${{ steps.scope.outputs.backend }}
      web: ${{ steps.scope.outputs.web }}
      components: ${{ steps.scope.outputs.components }}
      deploy: ${{ steps.scope.outputs.deploy }}
      images: ${{ steps.scope.outputs.images }}
      e2e: ${{ steps.scope.outputs.e2e }}
      gxp: ${{ steps.scope.outputs.gxp }}
      security: ${{ steps.scope.outputs.security }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: scope
        run: node scripts/ci-changes.mjs >> "$GITHUB_OUTPUT"
        env: { GH_TOKEN: "${{ github.token }}", EVENT: "${{ github.event_name }}", REPO: "${{ github.repository }}", PR: "${{ github.event.pull_request.number }}" }

  backend:
    needs: [changes]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with: { enable-cache: true }
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run bandit -q -c pyproject.toml -r app
      - run: uv run vulture
      - run: uv run xenon --max-absolute B --max-modules A --max-average A app
      - run: uv run deptry .
      - run: uv run pytest --junitxml="$RUNNER_TEMP/junit.xml"
      - name: The database tests ran (a skipped database test is green; the floor is in tests/db_floor.py)
        run: uv run python -m tests.db_floor "$RUNNER_TEMP/junit.xml"
      - run: uv run python -m app.export_openapi --check
      - run: uv run pip-audit

  docs:
    # Always runs (seconds). Markdown lint (specs, ADRs, plans, READMEs, CLAUDE.md), the documentation check (README, API reference, user guide, links)
    # and the architecture check (model, overview and imports agree: docs/architecture/model.json).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version: 24 }
      - run: npx --yes markdownlint-cli2@0.24.0
      - run: node scripts/docs.mjs check
      - run: node scripts/architecture.mjs check
      - run: node scripts/images.mjs check   # image names in deploy/ match ghcr.io/<this repository>

  components:
    # Agents, MCP servers and channel gateways (.sdlc/components.json): lint, types, security, tests, audit, images.
    needs: [changes]
    runs-on: ubuntu-latest
    if: needs.changes.outputs.components == 'true'  # hashFiles() is not allowed in a job-level if; .sdlc/components.json exists
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version: 24 }
      - run: node scripts/components.mjs check
      - run: node scripts/components.mjs audit
      - name: hadolint
        run: |
          for f in agents/*/Dockerfile mcp-servers/*/Dockerfile channels/*/Dockerfile; do
            if [ -f "$f" ]; then docker run --rm -i hadolint/hadolint:v2.15.1 < "$f"; fi
          done
      - name: shared package is in the mail-triage image
        run: |
          docker build -f agents/mail-triage/Dockerfile -t local/mail-triage:ci .
          docker run --rm --entrypoint python local/mail-triage:ci -c "from schedule_policy.policy import DEFAULT_POLICY; assert DEFAULT_POLICY"
      - name: build and scan the images
        run: |
          for dir in agents/* mcp-servers/* channels/*; do
            if [ -f "$dir/Dockerfile" ]; then
              # Images that depend on a shared package (packages/*) are built from the repo root.
              case "$dir" in agents/mail-triage) context=. ;; *) context="$dir" ;; esac
              docker build -f "$dir/Dockerfile" -t "local/$(basename "$dir"):ci" "$context"
              docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.76.2 image --exit-code 1 --ignore-unfixed --severity HIGH,CRITICAL "local/$(basename "$dir"):ci"
            fi
          done

  schedule-policy:
    # The shared schedule policy (INT-002, ADR-0030 item 4): the agent image and the backend both rely on its limits.
    # ci-changes.mjs has no flag for packages/schedule-policy, so run on any area that uses it.
    needs: [changes]
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.components == 'true'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: packages/schedule-policy } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest
      - run: uv run pip-audit

  web:
    needs: [changes]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: node packages/tokens/build.mjs --check
      - run: pnpm --filter web gen:api:check
      - run: pnpm -r lint
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: pnpm knip
      - run: pnpm run audit
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - name: Playwright ui-states (every login and settings state against a stubbed API, no backend)
        run: pnpm --filter web exec playwright test --project=ui-states
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with: { name: ui-states-report, path: apps/web/playwright-report, if-no-files-found: ignore }

  security:
    needs: [changes]
    if: needs.changes.outputs.security == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { fetch-depth: 0 }
      - name: semgrep
        run: docker run --rm -e SEMGREP_SEND_METRICS=off -v "$PWD:/src" semgrep/semgrep:1.182.0 semgrep scan --config p/owasp-top-ten --config p/secrets --config .semgrep/ --error
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 git /repo --redact --no-banner
      - name: trivy config (Dockerfiles, compose, chart)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with: { scan-type: config, scan-ref: ., exit-code: "1", severity: "HIGH,CRITICAL" }

  images:
    runs-on: ubuntu-latest
    needs: [changes, backend, web]
    # A skipped backend or web job (nothing changed there) does not stop the images from being built.
    if: ${{ !cancelled() && !failure() && needs.changes.outputs.images == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: hadolint
        run: |
          docker run --rm -i hadolint/hadolint:v2.15.1 < backend/Dockerfile
          docker run --rm -i hadolint/hadolint:v2.15.1 < apps/web/Dockerfile
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: build api
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with: { context: ., file: backend/Dockerfile, load: true, tags: "local/api:ci", cache-from: "type=gha,scope=api", cache-to: "type=gha,scope=api,mode=max" }
      - name: build web
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with: { context: ., file: apps/web/Dockerfile, load: true, tags: "local/web:ci", cache-from: "type=gha,scope=web", cache-to: "type=gha,scope=web,mode=max" }
      - name: trivy api
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with: { image-ref: "local/api:ci", exit-code: "1", ignore-unfixed: true, severity: "HIGH,CRITICAL" }
      - name: trivy web
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with: { image-ref: "local/web:ci", exit-code: "1", ignore-unfixed: true, severity: "HIGH,CRITICAL" }

  helm:
    needs: [changes]
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
      - run: helm lint --strict deploy/charts/app -f deploy/envs/local/values.yaml
      - name: kubeconform
        run: helm template app deploy/charts/app -f deploy/envs/local/values.yaml | docker run --rm -i ghcr.io/yannh/kubeconform:v0.8.0-alpine -strict -summary -
      - name: kube-linter
        run: helm template app deploy/charts/app -f deploy/envs/local/values.yaml > /tmp/render.yaml && docker run --rm -v /tmp:/tmp stackrox/kube-linter:v0.8.3 lint /tmp/render.yaml

  helm-worker:
    # The worker chart with its migration Job (ADR-0025), rendered with the local values of mail-triage.
    needs: [changes]
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
      - run: helm lint --strict deploy/charts/worker -f deploy/envs/local/mail-triage.yaml
      - name: kubeconform
        run: helm template mail-triage deploy/charts/worker -f deploy/envs/local/mail-triage.yaml | docker run --rm -i ghcr.io/yannh/kubeconform:v0.8.0-alpine -strict -summary -
      - name: kube-linter
        run: helm template mail-triage deploy/charts/worker -f deploy/envs/local/mail-triage.yaml > /tmp/render-worker.yaml && docker run --rm -v /tmp:/tmp stackrox/kube-linter:v0.8.3 lint /tmp/render-worker.yaml

  prod-like:
    # One job over the prod-like stack, brought up once (U-web-settings-42): migrate apart from `up --wait`, the database,
    # mail, role and edge checks, the Playwright `setup` project (signs in with the code from the catcher) and the smoke
    # test, then the log check. Replaces the former `e2e` and `runtime-role` jobs; their checks are kept below.
    runs-on: ubuntu-latest
    needs: [changes, images]
    # The e2e runs raise the limits of the spec (rate, cooldown, codes, per-client caps); compose defaults to the spec values.
    env:
      API_RATE_LIMIT_PER_MINUTE: "1000"
      API_RESEND_COOLDOWN_SECONDS: "1"
      API_CODES_PER_HOUR: "1000"
      API_OPEN_LOGIN_REQUESTS_PER_CLIENT: "1000"
      API_LOGIN_REQUESTS_PER_CLIENT_PER_HOUR: "1000"
    # Also runs for components and deploy changes: the runtime-role checks it replaces ran for those areas too.
    if: ${{ !cancelled() && !failure() && (needs.changes.outputs.e2e == 'true' || needs.changes.outputs.components == 'true' || needs.changes.outputs.deploy == 'true') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: .env with throwaway secrets (the api keys are 32 bytes or more and different from each other)
        run: |
          printf 'POSTGRES_PASSWORD=ci-%s\nMAIL_TRIAGE_RUNTIME_PASSWORD=ci-%s\nWEB_ROLE_PASSWORD=ci-%s\n' "$(openssl rand -hex 12)" "$(openssl rand -hex 12)" "$(openssl rand -hex 12)" > .env
          printf 'MAIL_SMTP_PASSWORD=ci-%s\nAPP_CODE_HASH_KEY=%s\nAPP_CSRF_KEY=%s\nAPP_USERNAME_HASH_KEY=%s\n' "$(openssl rand -hex 12)" "$(openssl rand -hex 32)" "$(openssl rand -hex 32)" "$(openssl rand -hex 32)" >> .env
      - name: private CA, edge, database and mail certificates
        run: deploy/prod-like/certs.sh
      - name: compose has no literal password (W-9; the unresolved file, so the .env values are not in it)
        run: |
          rendered="$(docker compose --profile prod-like config --no-interpolate)"
          if echo "$rendered" | grep -E '://[^:/[:space:]]+:[^$[:space:]@][^@[:space:]]*@'; then echo "a URL with a literal password"; exit 1; fi
          if echo "$rendered" | grep -E '(PASSWORD|SECRET)[A-Z_]*: +[^$[:space:]]'; then echo "a literal password"; exit 1; fi
      - name: database and mail catcher first (the migrate service needs the database; the api needs the catcher)
        run: |
          mkdir -p prodlike-logs
          docker compose --profile prod-like up -d --wait db mail
      - name: migrate (owner credentials; creates both roles; over verify-full TLS as in production; a one-shot service cannot be part of `up --wait`)
        run: |
          set -o pipefail
          docker compose run --rm --build -e ENVIRONMENT=production -e DATABASE_SSL=verify-full mail-triage-migrate 2>&1 | tee prodlike-logs/migrate.log
      - run: docker compose --profile prod-like up -d --build --wait
      - name: database over TLS (verify-full, host name, CA, plain refusal, roles), the catcher, the log canaries and /readyz of the api
        run: |
          echo "127.0.0.1 db mail-assistant.localhost" | sudo tee -a /etc/hosts
          answer="$(docker compose --profile prod-like exec -T api python -c "import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:8000/readyz').status)")"
          test "$answer" = 200 || { echo "readyz answered $answer"; exit 1; }
          set -a; . ./.env; set +a
          E2E_CANARY_FILE="$PWD/prodlike-logs/canaries.txt" E2E_PROD_LIKE=1 uv run --frozen --project backend pytest --no-cov backend/tests/e2e
      - name: role checks (AC-17, AC-30; the agent role, then the web role)
        run: |
          set -a; . ./.env; set +a
          uv run --frozen --project agents/mail-triage pytest -c tests/e2e/pytest.ini tests/e2e
          E2E_PROD_LIKE=1 uv run --frozen --project agents/mail-triage pytest --no-cov agents/mail-triage/tests/e2e
      - name: edge checks (redirect, HSTS, 404 matrix, query-free log)
        run: |
          base=https://mail-assistant.localhost:8443
          curl_edge() { curl -sS --cacert deploy/prod-like/certs/ca.crt --resolve mail-assistant.localhost:8443:127.0.0.1 "$@"; }
          location="$(curl -sS -o /dev/null -w '%{redirect_url}' http://127.0.0.1:8081/settings)"
          test "$location" = "https://mail-assistant.localhost:8443/settings"
          headers="$(curl_edge -D - -o /dev/null "$base/settings")"
          echo "$headers" | grep -i '^Strict-Transport-Security: max-age=31536000\s*$'
          if echo "$headers" | grep -qi 'includesubdomains\|preload'; then echo "HSTS is too broad"; exit 1; fi
          echo "$headers" | grep -i '^content-security-policy:'
          echo "$headers" | grep -i '^x-content-type-options: nosniff'
          scripts/prodlike-checks.sh headers
          for path in / /login /settings; do
            code="$(curl_edge -o /dev/null -w '%{http_code}' "$base$path")"
            test "$code" = 200 || { echo "$path answered $code"; exit 1; }
          done
          for path in /docs /redoc /openapi.json /healthz /readyz /metrics /api/docs /api/openapi.json /api/readyz /auth/anything-unknown /anything; do
            code="$(curl_edge -o /dev/null -w '%{http_code}' "$base$path")"
            test "$code" = 404 || { echo "$path answered $code"; exit 1; }
          done
          for path in /auth/login /api/settings; do
            answer="$(docker compose --profile prod-like exec -T web wget -q -S -O /dev/null "http://127.0.0.1:8080$path" 2>&1 || true)"
            echo "$answer" | grep -q 'HTTP/1.1 404' || { echo "web answered $path with: $answer"; exit 1; }
          done
          curl_edge -o /dev/null "$base/settings?probe=edge-log-canary"
          sleep 1
          docker compose --profile prod-like logs --no-color edge | tee /dev/stderr | grep -q '/settings'
          if docker compose --profile prod-like logs --no-color edge | grep -q -e 'edge-log-canary' -e 'probe='; then echo "the edge log has a query string"; exit 1; fi
      - name: let the browser trust the private CA
        run: |
          sudo apt-get install -y --no-install-recommends libnss3-tools
          mkdir -p "$HOME/.pki/nssdb"
          certutil -d "sql:$HOME/.pki/nssdb" -N --empty-password
          certutil -d "sql:$HOME/.pki/nssdb" -A -t "C,," -n mail-assistant-ci-ca -i deploy/prod-like/certs/ca.crt
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - name: Playwright (the setup project signs in, then the smoke test and the other specs)
        run: pnpm --filter web e2e
        env:
          E2E_BASE_URL: "https://mail-assistant.localhost:8443"
          NODE_EXTRA_CA_CERTS: ${{ github.workspace }}/deploy/prod-like/certs/ca.crt
      - name: no code, username, zone, password or cookie in the logs of api, web, edge, db and migrate
        run: |
          set -a; . ./.env; set +a
          E2E_CANARY_FILE="$PWD/prodlike-logs/canaries.txt" PRODLIKE_LOG_DIR="$PWD/prodlike-logs" scripts/prodlike-checks.sh logs
      - if: failure()
        run: |
          docker compose --profile prod-like logs --no-color edge web api db mail > prodlike-logs/stack.log || true
          docker compose --profile prod-like ps --all >> prodlike-logs/stack.log || true
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with: { name: playwright-report, path: apps/web/playwright-report, if-no-files-found: ignore }
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with: { name: prod-like-logs, path: prodlike-logs, if-no-files-found: ignore }
      - if: always()
        run: docker compose --profile prod-like down --volumes

  gxp:
    # GAMP 5 evidence run + validation package (only in projects with validation/system.yaml)
    runs-on: ubuntu-latest
    needs: [changes, images]
    # The e2e runs raise the limits of the spec (rate, cooldown, codes, per-client caps); compose defaults to the spec values.
    env:
      API_RATE_LIMIT_PER_MINUTE: "1000"
      API_RESEND_COOLDOWN_SECONDS: "1"
      API_CODES_PER_HOUR: "1000"
      API_OPEN_LOGIN_REQUESTS_PER_CLIENT: "1000"
      API_LOGIN_REQUESTS_PER_CLIENT_PER_HOUR: "1000"
    if: ${{ !cancelled() && !failure() && needs.changes.outputs.gxp == 'true' && vars.GXP_ENABLED == 'true' }}  # off for this project (ADR-0006); hashFiles() is not allowed in a job-level if
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm gxp:check
      - name: .env with throwaway secrets (the api keys are 32 bytes or more and different from each other)
        run: |
          printf 'POSTGRES_PASSWORD=ci-%s\nMAIL_TRIAGE_RUNTIME_PASSWORD=ci-%s\nWEB_ROLE_PASSWORD=ci-%s\n' "$(openssl rand -hex 12)" "$(openssl rand -hex 12)" "$(openssl rand -hex 12)" > .env
          printf 'MAIL_SMTP_PASSWORD=ci-%s\nAPP_CODE_HASH_KEY=%s\nAPP_CSRF_KEY=%s\nAPP_USERNAME_HASH_KEY=%s\n' "$(openssl rand -hex 12)" "$(openssl rand -hex 32)" "$(openssl rand -hex 32)" "$(openssl rand -hex 32)" >> .env
      - run: deploy/prod-like/certs.sh
      - run: docker compose --profile prod-like up -d --build --wait
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm --filter web e2e:gxp
        env: { GXP_EXECUTED_BY: "ci (${{ github.actor }})" }
      - if: always()
        run: pnpm gxp:package && pnpm gxp:verify "validation/packages/$(cat validation/evidence/runs/LATEST)"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with: { name: validation-package, path: validation/packages, retention-days: 90 }
