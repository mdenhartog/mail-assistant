[project]
name = "mail-assistant-api"
version = "0.1.0"
description = "Mail Assistant backend"
requires-python = ">=3.12"
dependencies = [
    "aiosmtplib>=5.1.3",
    "asyncpg>=0.32.0",
    "fastapi>=0.162.2",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "schedule-policy",
    "sqlalchemy[asyncio]>=2.1.8",
    "starlette>=1.10.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "aiosmtpd>=1.4.6",
    "alembic>=1.20.1",
    "asyncpg-stubs>=0.31.2",
    "bandit>=1.9.4",
    "cryptography>=50.0.2",
    "deptry>=0.25.1",
    "diff-cover>=11.0.1",
    "httpx>=0.28.1",
    "hypothesis>=6.170.15",
    "pip-audit>=2.10.1",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.17.4",
    "testcontainers[postgres]>=4.15.0",
    "vulture>=2.16",
    "xenon>=0.9.3",
]

[tool.uv]
exclude-newer = "7 days"
package = false

[tool.uv.sources]
schedule-policy = { path = "../packages/schedule-policy" }

# Temporary: versions already locked that are younger than the cooldown. Remove after 2026-11-15 (ADR-0022).
[tool.uv.exclude-newer-package]
anyio = "2026-11-08T23:59:59Z"
click = "2026-11-08T23:59:59Z"
coverage = "2026-11-08T23:59:59Z"
diff-cover = "2026-11-08T23:59:59Z"
fastapi = "2026-11-08T23:59:59Z"
filelock = "2026-11-08T23:59:59Z"
hypothesis = "2026-11-08T23:59:59Z"
pip = "2026-11-08T23:59:59Z"
platformdirs = "2026-11-08T23:59:59Z"
py-serializable = "2026-11-08T23:59:59Z"
pydantic = "2026-11-08T23:59:59Z"
pydantic-core = "2026-11-08T23:59:59Z"
pytest-asyncio = "2026-11-08T23:59:59Z"
ruff = "2026-11-08T23:59:59Z"
typing-inspection = "2026-11-08T23:59:59Z"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "TC", "RUF", "ASYNC", "S", "PT", "DTZ", "ERA", "TID", "ANN", "D", "C90", "PL"]
ignore = ["D100", "D104"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D", "ANN", "PLR2004"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["app", "schedule_policy"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q --strict-markers --cov=app --cov-branch --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
omit = ["app/__main__.py"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]

[tool.deptry.per_rule_ignores]
DEP002 = ["uvicorn", "asyncpg"]  # asyncpg: the driver SQLAlchemy loads by name; uvicorn: the server in the Dockerfile

[tool.vulture]
paths = ["app"]
min_confidence = 80
