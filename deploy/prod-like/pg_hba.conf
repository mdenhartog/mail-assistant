# Client authentication for the prod-like database (ADR-0037, W-9). Loaded by db-tls.sh through hba_file.
# First match wins: the web role may only come in over TLS and must prove its SCRAM password; a plain attempt is rejected
# before any password exchange. `local` is the unix socket inside the container, used by the health check and by the
# image's own first-start scripts; it is not reachable from outside.
# TYPE      DATABASE  USER                 ADDRESS  METHOD
local       all       all                           trust
hostssl     all       web_settings_runtime all      scram-sha-256
hostnossl   all       web_settings_runtime all      reject
host        all       all                  all      scram-sha-256
