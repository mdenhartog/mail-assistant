# Client authentication for the prod-like database (ADR-0037, W-9, SEC-10). Loaded by db-tls.sh through hba_file.
# Every role comes in over TLS only and must prove its SCRAM password: the web role, the agent role and the owner role
# that runs the migrations. No rule names a role, so a role added later is held to the same rule. A plain attempt is
# rejected before any password exchange. `local` is the unix socket inside the container, used by the health check and
# by the image's own first-start scripts; it is not reachable from outside.
# TYPE      DATABASE  USER  ADDRESS  METHOD
local       all       all            trust
hostssl     all       all   all      scram-sha-256
hostnossl   all       all   all      reject
