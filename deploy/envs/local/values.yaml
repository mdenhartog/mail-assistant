# kind cluster (/sdlc:k8s-local). Images are loaded into kind from the local prod-like build.
environment: local # tags instead of digests and no certificate alert; any other value gets the production rules
api:
  image: { repository: "mail-assistant-api", tag: "local", pullPolicy: Never }
  replicas: 1
  autoscaling: { enabled: false, minReplicas: 1, maxReplicas: 1, targetCPUUtilizationPercentage: 70 }
  config:
    username: owner
    emailAddress: owner@home.arpa
    publicOrigin: https://app.localhost
    noticeIntervalMinutes: 1
    # The kind pod network (default 10.244.0.0/16): the Traefik pod is addressed from it.
    trustedProxyCidrs: ["10.244.0.0/16"]
    trustedProxyHops: 1
    smtp: { host: smtp.home.arpa, port: 587, from: mail-assistant@home.arpa }
web:
  image: { repository: "mail-assistant-web", tag: "local", pullPolicy: Never }
  replicas: 1
  autoscaling: { enabled: false, minReplicas: 1, maxReplicas: 1, targetCPUUtilizationPercentage: 70 }
ingress:
  # Local only (ADR-0037). Traefik is the controller (ADR-0040); deploy/kind/traefik-values.yaml installs it and its CRDs.
  controller: traefik
  host: app.localhost
  localDomainSuffix: localhost
  clusterIssuer: selfsigned-local
  httpsPort: "8443" # kind maps the node port 30443 to 127.0.0.1:8443 (deploy/kind/kind-config.yaml)
networkPolicy:
  # The chart defaults name the Traefik namespace and pods (namespace traefik, label app.kubernetes.io/name=traefik).
  # Placeholder addresses of the kind cluster; the real database and SMTP host are decided before staging.
  egress:
    database: { cidr: 10.244.0.10/32, port: 5432 }
    smtp: { cidr: 10.244.0.11/32 }
