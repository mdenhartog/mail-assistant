apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "worker.name" . }}
  labels: {{- include "worker.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "worker.name" . }}
  labels: {{- include "worker.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {{- include "worker.selector" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "worker.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "worker.name" . }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: worker
          image: {{ include "worker.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            {{- include "worker.dbTls.env" . | nindent 12 }}
            {{- range $k, $v := .Values.env }}
            - { name: {{ $k }}, value: {{ $v | quote }} }
            {{- end }}
          {{- if .Values.envFromSecret }}
          envFrom:
            - secretRef: { name: {{ .Values.envFromSecret }} }
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources: {{- toYaml .Values.resources | nindent 12 }}
          startupProbe:
            {{- include "worker.probe" . | nindent 12 }}
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            {{- include "worker.probe" . | nindent 12 }}
            periodSeconds: 30
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            {{- include "worker.dbTls.mount" . | nindent 12 }}
      volumes:
        - { name: tmp, emptyDir: {} }
        {{- include "worker.dbTls.volume" . | nindent 8 }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "worker.name" . }}
  labels: {{- include "worker.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "worker.selector" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - namespaceSelector: {}
      ports: [{ port: 53, protocol: UDP }, { port: 53, protocol: TCP }]
    - ports: [{ port: 443 }]
    {{- if .Values.networkPolicy.databasePorts }}
    - to:
        - podSelector: {}
      ports:
        {{- range .Values.networkPolicy.databasePorts }}
        - { port: {{ . }} }
        {{- end }}
    {{- end }}
