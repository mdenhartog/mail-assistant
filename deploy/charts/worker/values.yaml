# One release per worker: helm upgrade --install <name> deploy/charts/worker -f deploy/envs/<env>/<name>.yaml
# Secure defaults (guardrail-kubernetes / guardrail-helm). A worker has no inbound port, so there is no Service, no
# Ingress and no PodDisruptionBudget, and it always runs as exactly one copy that is never started next to the old one.
nameOverride: ""
image: { repository: ghcr.io/OWNER/mail-assistant/worker, digest: "", tag: "0.1.0", pullPolicy: IfNotPresent }
# production (the default) holds the database connection to verify-full and requires image.digest (values.schema.json:
# sha256:<64 hex>, U-web-settings-66); development and test may use a tag and a weaker mode.
environment: production
# Database TLS (SEC-10, W-8, W-9). The worker and the migration Job connect with this mode and check the server
# certificate and host name against the CA in the ConfigMap named here (an existing ConfigMap with the key ca.crt; the CA
# certificate is public, no secret). Required for verify-ca and verify-full. The database URL in the Secrets carries no
# ssl value: it is ignored.
database:
  tls:
    sslMode: verify-full
    caConfigMap: ""
    caMountPath: /etc/db-ca
# Plain settings. Secrets never go here: name an existing Secret in envFromSecret (created by your secret store).
env: {}
envFromSecret: ""
resources:
  requests: { cpu: 50m, memory: 128Mi }
  limits: { cpu: 500m, memory: 512Mi }
# The worker touches this file at the end of every loop; the probe fails when it is older than maxAgeSeconds.
heartbeat: { path: /tmp/heartbeat, maxAgeSeconds: 180 }
# Outbound: DNS, HTTPS (Gmail, Anthropic, Telegram) and these ports inside the same namespace (the database).
# A Kubernetes NetworkPolicy cannot name hosts; pinning HTTPS to the three services needs a CNI with FQDN policies.
networkPolicy:
  databasePorts: [5432]
# Database migration (ADR-0025): a Job that runs before every install/upgrade as an Argo CD PreSync hook (and as a Helm
# pre-install/pre-upgrade hook when the chart is used without Argo CD). It connects as the OWNER role, migrates, and sets
# up the runtime role. Off by default: only a worker with a database needs it.
# secretName names an EXISTING Secret that the operator creates (see README); only this Job reads it, never the worker.
# Keys: DATABASE_OWNER_URL (owner connection string), RUNTIME_ROLE_PASSWORD (password of mail_triage_runtime, the same
# one that is inside DATABASE_URL of the worker's own Secret) and WEB_ROLE_PASSWORD (password of web_settings_runtime). No value ever goes into a values file.
migration:
  enabled: false
  secretName: ""
  command: [python, -m, app, migrate]
  backoffLimit: 2
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 3600
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 500m, memory: 256Mi }
  networkPolicy:
    databasePorts: [5432]
