{{- range $name := list "api" "web" }}
{{- $c := index $.Values $name }}
{{- $ctx := dict "name" $name "root" $ }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
  labels: {{- include "app.labels" $ctx | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
  labels: {{- include "app.labels" $ctx | nindent 4 }}
spec:
  {{- if or (eq $name "api") (not $c.autoscaling.enabled) }}
  replicas: {{ $c.replicas }}
  {{- end }}
  selector:
    matchLabels: {{- include "app.selector" $ctx | nindent 6 }}
  template:
    metadata:
      labels: {{- include "app.labels" $ctx | nindent 8 }}
    spec:
      serviceAccountName: {{ $.Release.Name }}-{{ $name }}
      automountServiceAccountToken: false
      {{- include "app.podSecurity" $ctx | nindent 6 }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {{- include "app.selector" $ctx | nindent 14 }}
      containers:
        - name: {{ $name }}
          image: {{ include "app.image" $c.image }}
          imagePullPolicy: {{ $c.image.pullPolicy }}
          ports:
            - { name: http, containerPort: {{ $c.port }} }
          {{- if eq $name "api" }}
          {{- $cfg := $c.config }}
          {{- $plain := dict "APP_USERNAME" $cfg.username "APP_EMAIL_ADDRESS" $cfg.emailAddress "APP_SMTP_HOST" $cfg.smtp.host "APP_SMTP_PORT" ($cfg.smtp.port | toString) "APP_SMTP_FROM" $cfg.smtp.from "APP_PUBLIC_ORIGIN" $cfg.publicOrigin "APP_NOTICE_INTERVAL_MINUTES" ($cfg.noticeIntervalMinutes | toString) "APP_TRUSTED_PROXY_CIDRS" ($cfg.trustedProxyCidrs | toJson) "APP_TRUSTED_PROXY_HOPS" ($cfg.trustedProxyHops | toString) }}
          {{- $plain = merge $plain (default dict $c.env) }}
          {{- $secrets := dict "APP_DATABASE_URL" "database-url" "APP_CODE_HASH_KEY" "code-hash-key" "APP_CSRF_KEY" "csrf-key" "APP_USERNAME_HASH_KEY" "username-hash-key" "APP_SMTP_USER" "smtp-user" "APP_SMTP_PASSWORD" "smtp-password" }}
          env:
            {{- range $k, $v := $plain }}
            - { name: {{ $k }}, value: {{ $v | quote }} }
            {{- end }}
            {{- range $k, $key := $secrets }}
            - name: {{ $k }}
              valueFrom:
                secretKeyRef: { name: {{ $.Release.Name }}-api, key: {{ $key }} }
            {{- end }}
          {{- else }}
          {{- with $c.env }}
          env:
            {{- range $k, $v := . }}
            - { name: {{ $k }}, value: {{ $v | quote }} }
            {{- end }}
          {{- end }}
          {{- end }}
          {{- include "app.containerSecurity" $ctx | nindent 10 }}
          resources: {{- toYaml $c.resources | nindent 12 }}
          {{- $probe := ternary "/healthz" "/" (eq $name "api") }}
          {{- $ready := ternary "/readyz" "/" (eq $name "api") }}
          startupProbe:
            httpGet: { path: {{ $probe }}, port: http }
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet: { path: {{ $probe }}, port: http }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: {{ $ready }}, port: http }
            periodSeconds: 5
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            {{- if eq $name "web" }}
            - { name: nginx-cache, mountPath: /var/cache/nginx }
            {{- end }}
      volumes:
        - { name: tmp, emptyDir: {} }
        {{- if eq $name "web" }}
        - { name: nginx-cache, emptyDir: {} }
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
  labels: {{- include "app.labels" $ctx | nindent 4 }}
spec:
  selector: {{- include "app.selector" $ctx | nindent 4 }}
  ports:
    - { name: http, port: {{ $c.port }}, targetPort: http }
{{- if and (ne $name "api") $c.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
  labels: {{- include "app.labels" $ctx | nindent 4 }}
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: {{ $.Release.Name }}-{{ $name }} }
  minReplicas: {{ $c.autoscaling.minReplicas }}
  maxReplicas: {{ $c.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: {{ $c.autoscaling.targetCPUUtilizationPercentage }} } }
{{- end }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
  labels: {{- include "app.labels" $ctx | nindent 4 }}
spec:
  minAvailable: {{ $.Values.podDisruptionBudget.minAvailable }}
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels: {{- include "app.selector" $ctx | nindent 6 }}
{{- end }}
