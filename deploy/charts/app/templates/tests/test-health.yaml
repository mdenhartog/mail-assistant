apiVersion: v1
kind: Pod
metadata:
  name: {{ .Release.Name }}-test-health
  labels: {{- include "app.labels" (dict "name" "test" "root" .) | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  {{- include "app.podSecurity" (dict "name" "test" "root" .) | nindent 2 }}
  containers:
    - name: curl
      image: curlimages/curl:8.17.0
      args: ["--fail", "--silent", "--show-error", "http://{{ .Release.Name }}-api:{{ .Values.api.port }}/healthz"]
      {{- include "app.containerSecurity" (dict "name" "test" "root" .) | nindent 6 }}
      resources:
        requests: { cpu: 10m, memory: 16Mi }
        limits: { cpu: 50m, memory: 32Mi }
