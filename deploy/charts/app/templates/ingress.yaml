{{- if .Values.ingress.enabled }}
{{- /* Local only (ADR-0037). values.schema.json enforces: tls and hsts on, host under the local suffix, private CA issuer. */ -}}
{{- $ingress := .Values.ingress }}
{{- $annotations := dict "cert-manager.io/cluster-issuer" $ingress.clusterIssuer }}
{{- if $ingress.hstsAnnotation.key }}
{{- $_ := set $annotations $ingress.hstsAnnotation.key (printf $ingress.hstsAnnotation.format "max-age=31536000") }}
{{- end }}
{{- $annotations = merge $annotations $ingress.annotations }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  labels: {{- include "app.labels" (dict "name" "ingress" "root" .) | nindent 4 }}
  annotations: {{- toYaml $annotations | nindent 4 }}
spec:
  {{- with $ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  tls:
    - hosts: [{{ $ingress.host | quote }}]
      secretName: {{ .Release.Name }}-tls
  rules:
    - host: {{ $ingress.host | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend: { service: { name: {{ .Release.Name }}-api, port: { name: http } } }
          - path: /auth
            pathType: Prefix
            backend: { service: { name: {{ .Release.Name }}-api, port: { name: http } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: {{ .Release.Name }}-web, port: { name: http } } }
{{- end }}
