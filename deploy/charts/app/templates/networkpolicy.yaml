{{- if .Values.networkPolicy.enabled }}
# Default deny for the release, then allow only what the app needs.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-default-deny
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }} }
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-allow-ingress
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }} }
  policyTypes: [Ingress]
  ingress:
    # One peer: the ingress controller's namespace AND its pods in the same item (W-9, W-17).
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressController.namespace }}
          podSelector:
            matchLabels: {{- toYaml .Values.networkPolicy.ingressController.podLabels | nindent 14 }}
      ports:
        - { port: http }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-allow-dns
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }} }
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
          podSelector: { matchLabels: { k8s-app: kube-dns } }
      ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
---
# The api reaches the database, DNS (above) and the SMTP host and port, nothing else: no HTTPS rule, no wide block (W-16).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-api-egress
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: api, app.kubernetes.io/instance: {{ .Release.Name }} }
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock: { cidr: {{ .Values.networkPolicy.egress.database.cidr | quote }} }
      ports:
        - { port: {{ .Values.networkPolicy.egress.database.port }}, protocol: TCP }
    - to:
        - ipBlock: { cidr: {{ .Values.networkPolicy.egress.smtp.cidr | quote }} }
      ports:
        - { port: {{ .Values.api.config.smtp.port }}, protocol: TCP }
{{- end }}
