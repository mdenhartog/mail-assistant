# Secure defaults (guardrail-kubernetes / guardrail-helm). Environments override only what differs.
api:
  image: { repository: ghcr.io/mdenhartog/mail-assistant/api, digest: "", tag: "0.1.0", pullPolicy: IfNotPresent }
  replicas: 2
  port: 8000
  env:
    APP_ENVIRONMENT: production
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }
  autoscaling: { enabled: true, minReplicas: 2, maxReplicas: 6, targetCPUUtilizationPercentage: 70 }

web:
  image: { repository: ghcr.io/mdenhartog/mail-assistant/web, digest: "", tag: "0.1.0", pullPolicy: IfNotPresent }
  replicas: 2
  port: 8080
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 250m, memory: 128Mi }
  autoscaling: { enabled: true, minReplicas: 2, maxReplicas: 4, targetCPUUtilizationPercentage: 70 }

ingress:
  enabled: true
  className: ""
  # Local only (ADR-0037): the host must sit under localDomainSuffix; there is no public name.
  host: app.home.arpa
  localDomainSuffix: home.arpa
  clusterIssuer: private-ca # a cert-manager issuer backed by the private CA
  tls: { enabled: true } # only true is accepted
  hsts: true # only true is accepted; max-age=31536000, no includeSubDomains, no preload
  # Controller-specific parts come from the environment values (hosting is an open point); none by default.
  hstsAnnotation: { key: "", format: "%s" } # annotation that carries the header; format gets "max-age=..."
  annotations: {}
  controllerConfig: {} # settings of the controller's own ConfigMap (TLS minimum, log format); not rendered here

podDisruptionBudget: { minAvailable: 1 }
networkPolicy: { enabled: true }
