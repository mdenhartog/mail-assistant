packages:
  - "apps/*"
  - "packages/*"
# eslint 9 is flagged deprecated, but eslint-plugin-react and eslint-plugin-jsx-a11y do not support eslint 10 yet
# (guardrail-typescript; the cap is tracked in plugins/sdlc/guardrails/stack.json). Remove this when they do.
allowedDeprecatedVersions:
  eslint: "9"
overrides:
  minimatch@>=7.0.0 <11.0.1: ^11.0.1
minimumReleaseAge: 10080
trustPolicy: no-downgrade
blockExoticSubdeps: true

# Temporary: versions already locked that are younger than the cooldown. Remove after 2026-11-15 (ADR-0022).
minimumReleaseAgeExclude:
  - "@babel/core@7.29.13"
  - "@babel/generator@7.29.13"
  - "@babel/helper-compilation-targets@7.29.13"
  - "@babel/helper-module-transforms@7.29.13"
  - "@babel/helper-string-parser@7.29.13"
  - "@babel/helpers@7.29.13"
  - "@babel/parser@7.29.13"
  - "@babel/runtime@7.29.13"
  - "@babel/traverse@7.29.13"
  - "@isaacs/nonrecursive-glob-match@1.1.0"
  - "@napi-rs/wasm-runtime@1.2.7"
